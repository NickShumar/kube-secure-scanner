apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: gitlab-runner
data:
  config.toml: |
    concurrent = 4
    [[runners]]
      name = "Kubernetes Runner"
      url = "http://your.gitlab.instance.url"
      token = "your-runner-token"
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "docker:latest"
        privileged = true